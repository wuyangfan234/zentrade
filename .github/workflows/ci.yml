name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --extra dev --frozen --python 3.11
      - name: Run backend tests
        run: uv run --frozen pytest tests -q --tb=short -p no:cacheprovider
      - name: Check undefined names
        run: uvx ruff check app --select F821 --no-cache --isolated

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm exec tsc -b
      - name: Run frontend tests
        run: pnpm test
      - name: Build
        run: pnpm build

  docs-and-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check documentation links and license copies
        run: python3 scripts/check_docs.py
      - name: Check whitespace errors
        run: git diff --check $(git hash-object -t tree /dev/null) HEAD -- . ':!*.gz' ':!*.png'
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  core-edition:
    # 开源核心版守门: 按 scripts/core_manifest.toml 导出, 在核心版自己的锁文件环境里跑后端与前端全量测试。
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Prime uv cache for offline relock
        working-directory: backend
        run: uv sync --extra dev --frozen --python 3.11
      - name: Export core edition
        run: uv run --project backend --frozen python scripts/export_core.py --out "$RUNNER_TEMP/core"
      - name: Core backend tests
        working-directory: ${{ runner.temp }}/core/backend
        run: |
          uv sync --extra dev --frozen --python 3.11
          uv run --frozen pytest tests -q --tb=short -p no:cacheprovider
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Core frontend tests and build
        working-directory: ${{ runner.temp }}/core/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc -b
          pnpm test
          pnpm build
      - name: Core docs and licence copies
        working-directory: ${{ runner.temp }}/core
        run: python3 scripts/check_docs.py

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: zentrade:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test /health
        run: |
          docker run -d --name zt -p 3018:3018 -e AUTH_PASSWORD=ci-only-password zentrade:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3018/health; then exit 0; fi
            sleep 2
          done
          docker logs zt
          exit 1
