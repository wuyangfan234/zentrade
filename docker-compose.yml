# 单容器部署: FastAPI 同时提供 API 与前端静态页面。
# 完整说明见 docs/deployment.md。
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BACKEND_EXTRAS: ${BACKEND_EXTRAS:-}
        CODEX_CLI_VERSION: ${CODEX_CLI_VERSION:-0.144.3}
        # 中国大陆网络可在 .env 设 USE_CN_MIRROR=1, 改用国内 npm / PyPI / Debian 镜像构建。
        USE_CN_MIRROR: ${USE_CN_MIRROR:-0}
    container_name: zentrade
    ports:
      # 默认只监听本机。局域网访问可在 .env 设 HOST=0.0.0.0;
      # 公网访问请放在 HTTPS 反向代理或受信隧道之后, 不要直接暴露端口。
      - "${HOST:-127.0.0.1}:${PORT:-3018}:3018"
    env_file:
      - .env
    environment:
      # 固定为容器内绝对路径, 防止 .env 里的 DATA_DIR=./data (本地开发用) 被原样传入容器,
      # 写到未挂载的目录导致重建容器丢数据。environment 优先级高于 env_file。
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
      # 保留原始 dotenv 值供首次密码初始化读取, 避免 Compose 展开密码中的 $VAR。
      - ./.env:/app/.env:ro
    restart: unless-stopped
