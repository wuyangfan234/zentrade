<!doctype html>
<html lang="zh-CN">
<head>

<style>
/* ZenTrade 参考稿共用样式: 色值取 frontend/src/index.css 亮色 (:root) 主题, 红涨绿跌, 琥珀只做警示 */
:root{--base:#F9FAFA;--surface:#FFFFFF;--elevated:#F4F5F6;--border:#E6E7E8;--fg:#111214;--fg2:#545960;--muted:#686E73;
  --accent:#1555E0;--bull:#C12115;--bear:#067944;--warn:#A24C07}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--base);color:var(--fg);font:13px/1.45 Inter,"HarmonyOS Sans SC","PingFang SC",system-ui,sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
a{color:var(--accent);text-decoration:none}
.app{display:flex;min-height:100vh}
/* 侧栏 224px, 导航顺序与分组同现网 Layout.tsx */
.side{width:224px;flex:none;background:var(--surface);border-right:1px solid var(--border);padding:14px 10px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:8px;padding:2px 8px 14px;font-weight:700;font-size:15px}
.logo{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--accent),#7c3aed);flex:none}
.ng{font-size:11px;color:var(--muted);padding:10px 10px 4px;font-weight:600}
.ni{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:6px;color:var(--fg2);font-size:13px}
.ni svg{width:16px;height:16px;flex:none}
.ni.on{background:#E6EDFC;color:var(--accent);font-weight:600}
main{flex:1;min-width:0}
.mtop{display:none;align-items:center;gap:8px;height:48px;padding:0 14px;border-bottom:1px solid var(--border);background:var(--surface);font-weight:700}
.burger{margin-left:auto;width:20px;height:14px;border-top:2px solid var(--fg2);border-bottom:2px solid var(--fg2);position:relative}
.burger::after{content:'';position:absolute;left:0;right:0;top:4px;border-top:2px solid var(--fg2)}
.demo-strip{position:sticky;top:0;z-index:20;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;background:#FDF3E7;border-bottom:1px solid #F1D3B3;color:var(--warn);font-size:12px;font-weight:600;padding:4px 12px}
.page{max-width:1280px;margin:0 auto;padding:16px 24px 64px}
.head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:18px;font-weight:600}
h2{font-size:14px;font-weight:600;white-space:nowrap}
h3{font-size:13px;font-weight:600;white-space:nowrap}
.meta{font-size:12px;color:var(--muted)}
.ml{margin-left:auto}
.nw{white-space:nowrap}
.sec{margin-top:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 1px 2px rgb(17 18 20 / .04);min-width:0}
.card-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--border)}
.card-b{padding:12px 14px}
/* 徽章 */
.b{display:inline-flex;align-items:center;white-space:nowrap;border-radius:4px;padding:0 6px;font-size:11px;font-weight:600;line-height:20px;flex:none}
.b.act{background:var(--accent);color:#fff}
.b.st{background:#E6EDFC;color:var(--accent)}
.b.lim{border:1px solid var(--border);color:var(--fg2);line-height:18px}
.b.warn{border:1px solid #E3B98F;color:var(--warn);line-height:18px;background:#FDF3E7}
.b.demo{background:var(--fg);color:#fff}
.b.up{background:#FBE9E7;color:var(--bull)}
.b.dn{background:#E3F3EB;color:var(--bear)}
.bull{color:var(--bull)}.bear{color:var(--bear)}.warn{color:var(--warn)}.mut{color:var(--muted)}.fg2{color:var(--fg2)}.acc{color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--fg);font-size:12px;white-space:nowrap}
.btn.pri{background:var(--fg);border-color:var(--fg);color:#fff}
.btn.ghost{border-color:transparent;color:var(--accent);padding:0 6px}
.btn[disabled]{color:var(--muted);cursor:default}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:0 10px;height:26px;font-size:12px;color:var(--fg2);white-space:nowrap}
.seg button.on{background:#E6EDFC;color:var(--accent);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
.num{font-variant-numeric:tabular-nums}
/* regime 状态条 (两页共用同一渲染函数与同一时间戳) */
.rg{display:flex;flex-direction:column}
.rg-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px}
.rg-state{display:flex;align-items:center;gap:8px}
.rg-name{font-size:18px;font-weight:700}
.scale{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.scale span{padding:0 9px;font-size:12px;line-height:22px;color:var(--muted);white-space:nowrap}
.scale span.on{background:var(--fg);color:#fff;font-weight:600}
.rg-time{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--fg2)}
.rg-time b{color:var(--fg);font-weight:600}
.rg-ev{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--border)}
.rg-item{display:flex;flex-direction:column;justify-content:center;padding:9px 14px;border-left:1px solid var(--border);min-width:0}
.rg-item:first-child{border-left:0}
.rg-k{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg2)}
.rg-no{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--elevated);color:var(--fg);font-size:11px;font-weight:700;flex:none}
.rg-v{font-size:15px;font-weight:700;margin-top:2px}
.rg-t{font-size:12px;color:var(--muted)}
.rg-log{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;padding:7px 14px;border-top:1px solid var(--border);font-size:12px;color:var(--fg2)}
.rg-log .lg{border:1px solid var(--border);border-radius:4px;padding:0 6px;line-height:20px}
.rg-log .lg b{color:var(--fg)}
.rg-foot{display:flex;gap:6px 14px;flex-wrap:wrap;padding:7px 14px;border-top:1px solid var(--border);background:var(--elevated);font-size:12px;color:var(--fg2);border-radius:0 0 8px 8px}
/* 置信区间横条 (同一把尺子) */
.ci{position:relative;height:18px;min-width:150px}
.ci .ax{position:absolute;left:0;right:0;top:8px;border-top:1px solid var(--border)}
.ci .z{position:absolute;top:2px;bottom:2px;border-left:1px dashed var(--muted)}
.ci .r{position:absolute;top:6px;height:5px;border-radius:3px;background:#9DB7F2}
.ci .p{position:absolute;top:4px;width:9px;height:9px;margin-left:-4px;border-radius:50%;background:var(--accent)}
.ci.out .r{background:#C9CCD0}.ci.out .p{background:var(--muted)}
.ci-scale{position:relative;height:15px;font-size:11px;line-height:15px;color:var(--muted);font-weight:400;min-width:150px}
.ci-scale span{position:absolute;top:0;white-space:nowrap}
.ci-scale span.c{transform:translateX(-50%)}
/* 表格 */
.tw{overflow-x:auto}
.tw::-webkit-scrollbar{height:6px}
.tw::-webkit-scrollbar-thumb{background:#B9BEC3;border-radius:999px}
table{border-collapse:collapse;width:100%}
th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:7px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:7px 10px;border-top:1px solid var(--border);vertical-align:middle}
tr.grp td{background:var(--elevated);font-weight:600;font-size:12px;color:var(--fg2);padding:5px 10px}
td.r,th.r{text-align:right}
tr.dim td{color:var(--muted)}
tr.empty td{color:var(--muted);font-size:12px}
.why{font-size:12px;color:var(--fg2);min-width:220px}
/* 抽屉 */
.mask{display:none;position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:40}
.mask.on{display:block}
.drawer{display:none;position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--surface);border-left:1px solid var(--border);z-index:41;overflow-y:auto;box-shadow:0 12px 32px rgb(17 18 20 / .1)}
.drawer.on{display:block}
.dr-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface)}
.dr-b{padding:12px 14px}
/* 归因明细 */
.attr{display:grid;grid-template-columns:44px minmax(0,1fr);gap:6px 10px;font-size:12px}
.attr .k{color:var(--muted);font-weight:600}
.attr .v{color:var(--fg);min-width:0}
.attr .v .sub{display:block;color:var(--fg2)}
.chipline{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
@media (max-width:767px){
  .side{display:none}
  .mtop{display:flex}
  .page{padding:12px 12px 48px}
  .rg-ev{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rg-item:nth-child(3){border-left:0}
  .rg-item:nth-child(n+3){border-top:1px solid var(--border)}
}

/* 因子页专属样式 */
.same{display:flex;gap:4px 12px;flex-wrap:wrap;margin:6px 2px 0}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;min-width:0}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:700;line-height:30px}
.kpi .s{font-size:12px;color:var(--fg2);white-space:nowrap}
.perf{display:inline-grid;grid-template-columns:30px 60px;align-items:end;gap:8px}
.perf b{text-align:right}
.mb{display:inline-flex;align-items:flex-end;gap:2px;height:18px}
.mb i{display:block;width:6px;background:#9AA0A6;border-radius:1px}
.mb i.neg{background:#E3B98F}
.rc{text-align:center}
.role{display:inline-block;font-size:11px;font-weight:600;line-height:18px;padding:0 6px;border-radius:4px;white-space:nowrap}
.role.champ{background:#E6EDFC;color:var(--accent)}
.role.ch{border:1px solid var(--border);color:var(--fg2);line-height:16px}
.role.out{color:var(--muted);border:1px dashed var(--muted);line-height:16px}
.slot-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%;border:0;background:none;text-align:left;padding:11px 14px;color:var(--fg)}
.chev{width:12px;color:var(--fg2)}
.slot-b{display:none;border-top:1px solid var(--border)}
.slot.on .slot-b{display:block}
.blk{padding:10px 14px}
.blk+.blk{border-top:1px solid var(--border)}
.blk h3{margin-bottom:8px}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-size:12px;white-space:nowrap;background:var(--elevated)}
.fl{display:block;font-size:11px;color:var(--muted);white-space:nowrap}
.wtag{display:inline-block;font-size:11px;font-weight:600;margin-right:6px;white-space:nowrap}
.wtag.champ{color:var(--accent)}
.wtag.ch{color:var(--fg2)}
.wtag.out{color:var(--warn)}
table.cmp td{padding-top:6px;padding-bottom:6px}
.clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:6px 12px}
.crow{display:grid;grid-template-columns:52px minmax(0,1fr) auto auto;align-items:center;gap:8px;min-height:42px;padding:3px 8px;border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:12px}
.crow:hover{background:var(--elevated)}
.crow .sym{font-size:13px}
.cmid{display:flex;flex-direction:column;min-width:0;line-height:16px}
.crow .cst{justify-self:end}
.empty-line{font-size:12px;padding:8px 10px;border:1px dashed var(--muted);border-radius:6px;background:var(--base)}
.mhint{display:none;padding:6px 14px;border-bottom:1px solid var(--border);color:var(--accent);font-weight:600}
.mhint.in{padding:0 0 6px;border:0}
@media (max-width:767px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mhint{display:block}
  .head .seg{margin-left:0}
}

</style>
</head>
<body data-page="factor">
<div class="app">

<script>
/* ZenTrade 参考稿共用脚本: 侧栏 / regime 状态条 / 虚拟数据 (两页同一份) / 归因明细 / 抽屉。

'use strict';
var Q = new URLSearchParams(location.search);
var SPARSE = Q.get('d') === 'sparse';
var MINUS = '\u2212';

var ICON = {
  leaf: '<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>',

  radio: '<path d="M4.9 16.1C1 12.2 1 5.8 4.9 1.9"/><path d="M7.8 4.7a6.14 6.14 0 0 0-.8 7.5"/><circle cx="12" cy="9" r="2"/><path d="M16.2 4.8c2 2 2.26 5.11.8 7.47"/><path d="M19.1 1.9a9.96 9.96 0 0 1 0 14.1"/><path d="M9.5 18h5"/><path d="m8 22 4-11 4 11"/>',

};
/* 导航顺序与分组 = frontend/src/components/Layout.tsx NAV + NAV_GROUPS */
var NAV = [
  ['交易', [['机会', 'leaf', 'opp-next.html', 'opp'], ['持仓', 'wallet']]],
  ['行情', [['情报', 'gauge'], ['自选', 'star'], ['个股分析', 'trend']]],
  ['研究', [['策略', 'scan'], ['因子', 'sigma', 'factor-next.html', 'factor'], ['回测', 'history'], ['信号库', 'zap']]],

  ['系统', [['数据', 'db'], ['系统状态', 'act']]]
];
function svg(name) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ICON[name] + '</svg>';
}
function renderSide(active) {
  var h = '<div class="brand"><span class="logo"></span>ZenTrade</div>';
  NAV.forEach(function (g) {
    h += '<div class="ng">' + g[0] + '</div>';
    g[1].forEach(function (it) {
      var on = it[3] === active ? ' on' : '';
      h += it[2] ? '<a class="ni' + on + '" href="' + it[2] + '">' + svg(it[1]) + it[0] + '</a>'
        : '<span class="ni">' + svg(it[1]) + it[0] + '</span>';
    });
  });
  document.getElementById('side').innerHTML = h;
}

/* ---------------------------------------------------------------- 格式 */
function sg(v, d) { var a = Math.abs(v).toFixed(d); return (Number(a) === 0 ? '' : v > 0 ? '+' : MINUS) + a; }
function fR(v) { return sg(v, 2) + 'R'; }
function tone(v) { return Math.abs(v) < 0.005 ? '' : v > 0 ? 'bull' : 'bear'; }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
var SIDE = { long: '\u2191 做多', short: '\u2193 做空' };

/* ---------------------------------------------------------------- regime (两页同一份) */
var REGIME = {
  fp: 'RG-1125-1015', state: 'up', name: '上行趋势', days: 6, conf: 0.78,
  updated: '11-25 10:15 ET', next: '10:30 ET', cadence: '每 15 分钟 + 事件触发', old: '整点重判 · 60 分钟',

  ]
};
var NO = ['', '\u2460', '\u2461', '\u2462', '\u2463'];
function regimeBar() {
  var r = REGIME;
  var sc = [['down', '下行'], ['range', '震荡'], ['up', '上行']].map(function (x) {
    return '<span class="' + (x[0] === r.state ? 'on' : '') + '">' + x[1] + '</span>';
  }).join('');
  var ev = r.ev.map(function (e) {
    return '<div class="rg-item" data-item="rg-ev' + (e.ok ? ' rg-ok' : '') + '" data-rg-ev="' + e.no + '"><div class="rg-k"><span class="rg-no">' + e.no + '</span><span class="nw">' + e.k + '</span></div>' +

  var nOk = r.ev.filter(function (e) { return e.ok; }).length;
  return '<section class="card rg" data-regime data-fp="' + r.fp + '">' +

      body += '<tr data-item="m-' + sl.id + '-' + t + ' mem-' + t + '"' + (t === 'out' ? ' class="dim"' : '') + '><td><b class="nw">' + s.name + '</b><span class="fl">' +
        s.f.map(function (id) { return FBY[id].label; }).join(' · ') + '</span></td>' +
        '<td class="r num ' + (t === 'out' ? '' : tone(s.ex)) + '"><b>' + fR(s.ex) + '</b></td><td>' + ciBar(s) + '</td><td class="r num">' + s.n + '</td>' +
        '<td class="num nw">' + s.last + '</td><td class="why"><span class="wtag ' + t + '">' + (t === 'out' ? '换下' : t === 'ch' ? '待定' : '留用') + '</span>' + s.why + '</td></tr>';
    });
  });
  return '<div class="mhint meta in">表内左右滑动 \u2192</div><div class="tw"><table class="cmp"><thead><tr><th>' + sl.use + '</th><th class="r">每笔超额</th><th>95% 区间 ' + ciScale() + '</th><th class="r">样本</th><th>最近结算</th><th>准入 / 淘汰理由</th></tr></thead><tbody>' +
    body + '</tbody></table></div>';
}

function cardList(sl) {
  var cs = slotCards(sl.id);
  if (!cs.length) return '<div class="empty-line mut">近期 0 张卡 · 在用成员下次出卡后显示</div>';
  return '<div class="clist">' + cs.map(function (c) {
    var s = SBY[c.strat];
    var st = c.timing === 'x' ? '<span class="b st">跨日有效</span>' : c.timing === 'i' ? '<span class="b lim">盘中事件</span>'
      : '<b class="num ' + tone(c.res) + '">' + fR(c.res) + '</b>';
    var when = c.timing ? (c.timing === 'x' ? c.gen.slice(0, 5) : '11-25') : c.settled;
    var tail = sl.id === 'score' ? '打分第 ' + c.rank : c.timing ? '今日' : c.exit;
    return '<div class="crow" data-item="cards-' + sl.id + '" role="button" tabindex="0" data-open="' + c.id + '"><b class="sym num">' + c.sym + '</b>' +
      '<span class="cmid"><span class="nw">' + s.name + '</span><span class="nw mut">' + when + ' · ' + tail + '</span></span>' +
      '<span class="cst">' + st + '</span><button class="btn ghost" data-open="' + c.id + '">归因</button></div>';
  }).join('') + '</div>';
}

function slotCard(sl) {
  var ms = members(sl.id), on = EXPAND.indexOf(sl.id) >= 0;
  var cnt = function (t) { return ms.filter(function (s) { return s.tier === t; }).length; };
  var champF = [];
  ms.filter(function (s) { return s.tier === 'champ'; }).forEach(function (s) { s.f.forEach(function (id) { if (champF.indexOf(id) < 0) champF.push(id); }); });
  var fchips = champF.map(function (id) {
    var f = FBY[id], st = fState(f);
    return '<span class="fchip" data-item="ref-' + sl.id + '"><b>' + f.label + '</b><span class="num ' + tone(f.w[3]) + '">' + fR(f.w[3]) + '</span><span class="' + st[1] + '">' + st[0] + '</span></span>';
  }).join('');
  var ncards = slotCards(sl.id).length;
  return '<section class="card sec slot' + (on ? ' on' : '') + '" data-item="slot" data-slot="' + sl.id + '">' +
    '<button class="slot-h" data-slot-toggle="' + sl.id + '" aria-expanded="' + on + '"><span class="chev">' + (on ? '\u25BE' : '\u25B8') + '</span><h2>' + sl.name + '</h2>' +
    ['champ', 'ch', 'out'].map(function (t) { return '<span class="b lim">' + TIER[t] + ' <span data-count="m-' + sl.id + '-' + t + '">' + cnt(t) + '</span></span>'; }).join('') + '<span class="b st">近期卡 <span data-count="cards-' + sl.id + '">' + ncards + '</span></span>' +
    '<span class="meta ml nw">尺子 · ' + sl.ruler + '</span></button>' +
    '<div class="slot-b">' +
    '<div class="blk"><h3>引用因子 <span class="num fg2" data-count="ref-' + sl.id + '">' + champF.length + '</span><span class="meta"> · 本周超额 · 状态</span></h3><div class="chipline">' + fchips + '</div></div>' +
    '<div class="blk"><h3>在用 vs 挑战者 · 同尺</h3>' + cmpTable(sl) + '</div>' +
    '<div class="blk"><h3>最近产出的卡 <span class="num fg2" data-count="cards-' + sl.id + '">' + ncards + '</span><span class="meta"> · 点开看归因</span></h3>' + cardList(sl) + '</div>' +
    '</div></section>';
}

function render() {
  var tabs = ['按用途', '因子库', '周度发现', '检验'].map(function (t, i) { return '<button class="' + (i === 0 ? 'on' : '') + '">' + t + '</button>'; }).join('');
  document.getElementById('app').innerHTML =
    '<div class="head"><h1>因子</h1><span class="meta nw">11-25 周三 · 10:24 ET</span><span class="b demo">DEMO · 虚拟数据</span><span class="seg ml">' + tabs + '</span></div>' +
    regimeBar() + '<div class="same meta"><span class="nw">与机会页同一状态条</span><span class="nw">指纹 ' + REGIME.fp + '</span><a class="nw" href="opp-next.html">去机会页对照</a></div>' +
    summary() + factorMatrix() + SLOTS.map(slotCard).join('');
}
render();

document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-slot-toggle]');
  if (t) {
    var sec = t.closest('.slot'), on = sec.classList.toggle('on');
    t.setAttribute('aria-expanded', on); t.querySelector('.chev').textContent = on ? '\u25BE' : '\u25B8';
    return;
  }
  var o = e.target.closest('[data-open]');
  if (o) openDrawer(o.dataset.open);
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target.matches && e.target.matches('.crow')) openDrawer(e.target.dataset.open);
});
if (Q.get('open')) openDrawer(Q.get('open'));

</script>
</body>
</html>
