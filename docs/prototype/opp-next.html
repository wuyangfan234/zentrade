<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>机会 · 新版原型 · DEMO 虚拟数据</title>
<!-- ZenTrade 参考稿 · DEMO 虚拟数据 · 由 docs/prototype/tools/build.py 从 docs/prototype/src 生成, 不要手改 -->
<style>
/* ZenTrade 参考稿共用样式: 色值取 frontend/src/index.css 亮色 (:root) 主题, 红涨绿跌, 琥珀只做警示 */
:root{--base:#F9FAFA;--surface:#FFFFFF;--elevated:#F4F5F6;--border:#E6E7E8;--fg:#111214;--fg2:#545960;--muted:#686E73;
  --accent:#1555E0;--bull:#C12115;--bear:#067944;--warn:#A24C07}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--base);color:var(--fg);font:13px/1.45 Inter,"HarmonyOS Sans SC","PingFang SC",system-ui,sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
a{color:var(--accent);text-decoration:none}
.app{display:flex;min-height:100vh}
/* 侧栏 224px, 导航顺序与分组同现网 Layout.tsx */
.side{width:224px;flex:none;background:var(--surface);border-right:1px solid var(--border);padding:14px 10px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:8px;padding:2px 8px 14px;font-weight:700;font-size:15px}
.logo{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--accent),#7c3aed);flex:none}
.ng{font-size:11px;color:var(--muted);padding:10px 10px 4px;font-weight:600}
.ni{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:6px;color:var(--fg2);font-size:13px}
.ni svg{width:16px;height:16px;flex:none}
.ni.on{background:#E6EDFC;color:var(--accent);font-weight:600}
main{flex:1;min-width:0}
.mtop{display:none;align-items:center;gap:8px;height:48px;padding:0 14px;border-bottom:1px solid var(--border);background:var(--surface);font-weight:700}
.burger{margin-left:auto;width:20px;height:14px;border-top:2px solid var(--fg2);border-bottom:2px solid var(--fg2);position:relative}
.burger::after{content:'';position:absolute;left:0;right:0;top:4px;border-top:2px solid var(--fg2)}
.demo-strip{position:sticky;top:0;z-index:20;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;background:#FDF3E7;border-bottom:1px solid #F1D3B3;color:var(--warn);font-size:12px;font-weight:600;padding:4px 12px}
.page{max-width:1280px;margin:0 auto;padding:16px 24px 64px}
.head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:18px;font-weight:600}
h2{font-size:14px;font-weight:600;white-space:nowrap}
h3{font-size:13px;font-weight:600;white-space:nowrap}
.meta{font-size:12px;color:var(--muted)}
.ml{margin-left:auto}
.nw{white-space:nowrap}
.sec{margin-top:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 1px 2px rgb(17 18 20 / .04);min-width:0}
.card-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--border)}
.card-b{padding:12px 14px}
/* 徽章 */
.b{display:inline-flex;align-items:center;white-space:nowrap;border-radius:4px;padding:0 6px;font-size:11px;font-weight:600;line-height:20px;flex:none}
.b.act{background:var(--accent);color:#fff}
.b.st{background:#E6EDFC;color:var(--accent)}
.b.lim{border:1px solid var(--border);color:var(--fg2);line-height:18px}
.b.warn{border:1px solid #E3B98F;color:var(--warn);line-height:18px;background:#FDF3E7}
.b.demo{background:var(--fg);color:#fff}
.b.up{background:#FBE9E7;color:var(--bull)}
.b.dn{background:#E3F3EB;color:var(--bear)}
.bull{color:var(--bull)}.bear{color:var(--bear)}.warn{color:var(--warn)}.mut{color:var(--muted)}.fg2{color:var(--fg2)}.acc{color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--fg);font-size:12px;white-space:nowrap}
.btn.pri{background:var(--fg);border-color:var(--fg);color:#fff}
.btn.ghost{border-color:transparent;color:var(--accent);padding:0 6px}
.btn[disabled]{color:var(--muted);cursor:default}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:0 10px;height:26px;font-size:12px;color:var(--fg2);white-space:nowrap}
.seg button.on{background:#E6EDFC;color:var(--accent);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
.num{font-variant-numeric:tabular-nums}
/* regime 状态条 (两页共用同一渲染函数与同一时间戳) */
.rg{display:flex;flex-direction:column}
.rg-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px}
.rg-state{display:flex;align-items:center;gap:8px}
.rg-name{font-size:18px;font-weight:700}
.scale{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.scale span{padding:0 9px;font-size:12px;line-height:22px;color:var(--muted);white-space:nowrap}
.scale span.on{background:var(--fg);color:#fff;font-weight:600}
.rg-time{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--fg2)}
.rg-time b{color:var(--fg);font-weight:600}
.rg-ev{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--border)}
.rg-item{display:flex;flex-direction:column;justify-content:center;padding:9px 14px;border-left:1px solid var(--border);min-width:0}
.rg-item:first-child{border-left:0}
.rg-k{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg2)}
.rg-no{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--elevated);color:var(--fg);font-size:11px;font-weight:700;flex:none}
.rg-v{font-size:15px;font-weight:700;margin-top:2px}
.rg-t{font-size:12px;color:var(--muted)}
.rg-log{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;padding:7px 14px;border-top:1px solid var(--border);font-size:12px;color:var(--fg2)}
.rg-log .lg{border:1px solid var(--border);border-radius:4px;padding:0 6px;line-height:20px}
.rg-log .lg b{color:var(--fg)}
.rg-foot{display:flex;gap:6px 14px;flex-wrap:wrap;padding:7px 14px;border-top:1px solid var(--border);background:var(--elevated);font-size:12px;color:var(--fg2);border-radius:0 0 8px 8px}
/* 置信区间横条 (同一把尺子) */
.ci{position:relative;height:18px;min-width:150px}
.ci .ax{position:absolute;left:0;right:0;top:8px;border-top:1px solid var(--border)}
.ci .z{position:absolute;top:2px;bottom:2px;border-left:1px dashed var(--muted)}
.ci .r{position:absolute;top:6px;height:5px;border-radius:3px;background:#9DB7F2}
.ci .p{position:absolute;top:4px;width:9px;height:9px;margin-left:-4px;border-radius:50%;background:var(--accent)}
.ci.out .r{background:#C9CCD0}.ci.out .p{background:var(--muted)}
.ci-scale{position:relative;height:15px;font-size:11px;line-height:15px;color:var(--muted);font-weight:400;min-width:150px}
.ci-scale span{position:absolute;top:0;white-space:nowrap}
.ci-scale span.c{transform:translateX(-50%)}
/* 表格 */
.tw{overflow-x:auto}
.tw::-webkit-scrollbar{height:6px}
.tw::-webkit-scrollbar-thumb{background:#B9BEC3;border-radius:999px}
table{border-collapse:collapse;width:100%}
th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:7px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:7px 10px;border-top:1px solid var(--border);vertical-align:middle}
tr.grp td{background:var(--elevated);font-weight:600;font-size:12px;color:var(--fg2);padding:5px 10px}
td.r,th.r{text-align:right}
tr.dim td{color:var(--muted)}
tr.empty td{color:var(--muted);font-size:12px}
.why{font-size:12px;color:var(--fg2);min-width:220px}
/* 抽屉 */
.mask{display:none;position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:40}
.mask.on{display:block}
.drawer{display:none;position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--surface);border-left:1px solid var(--border);z-index:41;overflow-y:auto;box-shadow:0 12px 32px rgb(17 18 20 / .1)}
.drawer.on{display:block}
.dr-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface)}
.dr-b{padding:12px 14px}
/* 归因明细 */
.attr{display:grid;grid-template-columns:44px minmax(0,1fr);gap:6px 10px;font-size:12px}
.attr .k{color:var(--muted);font-weight:600}
.attr .v{color:var(--fg);min-width:0}
.attr .v .sub{display:block;color:var(--fg2)}
.chipline{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
@media (max-width:767px){
  .side{display:none}
  .mtop{display:flex}
  .page{padding:12px 12px 48px}
  .rg-ev{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rg-item:nth-child(3){border-left:0}
  .rg-item:nth-child(n+3){border-top:1px solid var(--border)}
}

/* 机会页专属样式 */
.cg[hidden]{display:none}
.cg+.cg:not([hidden]){margin-top:14px}
.cg-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));align-items:stretch}
.cc{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--surface);display:flex;flex-direction:column;gap:7px;min-width:0;scroll-margin-top:84px}
.cc[hidden]{display:none}
.cc-top{display:flex;align-items:center;gap:8px;min-height:22px}
.sym{font-size:15px;font-weight:700}
.ic{width:12px;height:12px;margin-right:3px}
.cc-time{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;color:var(--fg2);min-height:18px}
.cd b{font-weight:700;color:var(--fg)}
.cd.warn,.cd.warn b{color:var(--warn)}
.ttl{height:3px;border-radius:2px;background:var(--elevated);overflow:hidden}
.ttl span{display:block;height:100%;background:var(--accent)}
.ttl span.low{background:var(--warn)}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,auto));justify-content:space-between;gap:4px 10px;background:var(--elevated);border-radius:6px;padding:6px 10px}
.kv>div{display:flex;flex-direction:column;min-width:0}
.kv .k{font-size:11px;color:var(--muted)}
.kv .v{font-size:13px;font-weight:600;white-space:nowrap}
.cc-why{font-size:12px;font-weight:600}
.cc-src{margin-top:auto;display:flex;align-items:center;flex-wrap:wrap;gap:2px 6px;font-size:12px;color:var(--fg2);border-top:1px solid var(--border);padding-top:6px}
.cc-attr{display:none;border-top:1px dashed var(--border);padding-top:8px}
.cc-attr.on{display:block}
.empty{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding:10px 12px;border:1px dashed var(--muted);border-radius:8px;background:var(--base);font-size:12px}
.mhint{display:none;padding:6px 14px;border-bottom:1px solid var(--border);color:var(--accent);font-weight:600}
.mhint.in{padding:0 0 6px;border:0}
.sp-grid{display:grid;grid-template-columns:150px repeat(4,minmax(0,1fr))}
.sp-big{display:flex;flex-direction:column;justify-content:center;padding:10px 14px}
.sp-big .num{font-size:26px;font-weight:700;line-height:32px}
.sp-row{display:flex;flex-direction:column;gap:4px;padding:10px 14px;border-left:1px solid var(--border);min-width:0}
.sp-k{display:flex;align-items:baseline;gap:6px;font-size:12px;font-weight:600}
.sp-k .meta{font-weight:400}
.sp-b{display:grid;grid-template-columns:28px minmax(0,1fr) 28px;align-items:center;gap:6px;font-size:12px}
.sp-b .bar{display:block;height:7px;border-radius:4px;justify-self:start}
.sp-b .bar.old{background:#C9CCD0}
.sp-b .bar.new{background:var(--accent)}
.sp-b b{text-align:right}
@media (min-width:768px) and (max-width:1099px){
  .sp-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sp-big{grid-column:1 / -1;flex-direction:row;align-items:baseline;gap:8px;border-bottom:1px solid var(--border)}
  .sp-row:nth-child(2n){border-left:0}
  .sp-row:nth-child(n+4){border-top:1px solid var(--border)}
}
@media (max-width:767px){
  .mhint{display:block}
  .kv{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sp-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sp-big{grid-column:1 / -1;flex-direction:row;align-items:baseline;gap:8px;border-bottom:1px solid var(--border)}
  .sp-row:nth-child(2n){border-left:0}
  .sp-row:nth-child(n+4){border-top:1px solid var(--border)}
}

</style>
</head>
<body data-page="opp">
<div class="app">
  <aside class="side" id="side"></aside>
  <main>
    <div class="mtop"><span class="logo"></span>ZenTrade<span class="burger"></span></div>
    <div class="demo-strip" data-demo><span>DEMO · 虚拟数据</span><span>非实时行情</span><span>非真实账户</span></div>
    <div class="page" id="app"></div>
  </main>
</div>
<div class="mask" id="mask"></div>
<aside class="drawer" id="dr-card"></aside>
<script>
/* ZenTrade 参考稿共用脚本: 侧栏 / regime 状态条 / 虚拟数据 (两页同一份) / 归因明细 / 抽屉。
 * 全部数字为 DEMO 虚拟数据, 计数一律由数据现算, 不手填。
 * 地址参数: ?d=sparse 稀疏态 · ?c=<卡id> 展开该卡归因 · ?open=<卡id> 打开归因抽屉 · ?f=x|i 机会筛选 · ?x=all 槽位全展开 */
'use strict';
var Q = new URLSearchParams(location.search);
var SPARSE = Q.get('d') === 'sparse';
var MINUS = '\u2212';

var ICON = {
  leaf: '<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>',
  wallet: '<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
  gauge: '<path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>',
  star: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
  trend: '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',
  scan: '<path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/><path d="m16 16-1.9-1.9"/>',
  sigma: '<path d="M18 7V5a1 1 0 0 0-1-1H6.5a.5.5 0 0 0-.4.8l4.5 6a2 2 0 0 1 0 2.4l-4.5 6a.5.5 0 0 0 .4.8H17a1 1 0 0 0 1-1v-2"/>',
  history: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
  zap: '<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',
  radio: '<path d="M4.9 16.1C1 12.2 1 5.8 4.9 1.9"/><path d="M7.8 4.7a6.14 6.14 0 0 0-.8 7.5"/><circle cx="12" cy="9" r="2"/><path d="M16.2 4.8c2 2 2.26 5.11.8 7.47"/><path d="M19.1 1.9a9.96 9.96 0 0 1 0 14.1"/><path d="M9.5 18h5"/><path d="m8 22 4-11 4 11"/>',
  layers: '<path d="m16.02 12 5.48 3.13a1 1 0 0 1 0 1.74L13 21.74a2 2 0 0 1-2 0l-8.5-4.87a1 1 0 0 1 0-1.74L7.98 12"/><path d="M13 13.74a2 2 0 0 1-2 0L2.5 8.87a1 1 0 0 1 0-1.74L11 2.26a2 2 0 0 1 2 0l8.5 4.87a1 1 0 0 1 0 1.74Z"/>',
  db: '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/>',
  act: '<path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/>'
};
/* 导航顺序与分组 = frontend/src/components/Layout.tsx NAV + NAV_GROUPS */
var NAV = [
  ['交易', [['机会', 'leaf', 'opp-next.html', 'opp'], ['持仓', 'wallet']]],
  ['行情', [['情报', 'gauge'], ['自选', 'star'], ['个股分析', 'trend']]],
  ['研究', [['策略', 'scan'], ['因子', 'sigma', 'factor-next.html', 'factor'], ['回测', 'history'], ['信号库', 'zap']]],
  ['提醒', [['监控中心', 'radio'], ['持仓提醒', 'layers']]],
  ['系统', [['数据', 'db'], ['系统状态', 'act']]]
];
function svg(name) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ICON[name] + '</svg>';
}
function renderSide(active) {
  var h = '<div class="brand"><span class="logo"></span>ZenTrade</div>';
  NAV.forEach(function (g) {
    h += '<div class="ng">' + g[0] + '</div>';
    g[1].forEach(function (it) {
      var on = it[3] === active ? ' on' : '';
      h += it[2] ? '<a class="ni' + on + '" href="' + it[2] + '">' + svg(it[1]) + it[0] + '</a>'
        : '<span class="ni">' + svg(it[1]) + it[0] + '</span>';
    });
  });
  document.getElementById('side').innerHTML = h;
}

/* ---------------------------------------------------------------- 格式 */
function sg(v, d) { var a = Math.abs(v).toFixed(d); return (Number(a) === 0 ? '' : v > 0 ? '+' : MINUS) + a; }
function fR(v) { return sg(v, 2) + 'R'; }
function tone(v) { return Math.abs(v) < 0.005 ? '' : v > 0 ? 'bull' : 'bear'; }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
var SIDE = { long: '\u2191 做多', short: '\u2193 做空' };

/* ---------------------------------------------------------------- regime (两页同一份) */
var REGIME = {
  fp: 'RG-1125-1015', state: 'up', name: '上行趋势', days: 6, conf: 0.78,
  updated: '11-25 10:15 ET', next: '10:30 ET', cadence: '每 15 分钟 + 事件触发', old: '整点重判 · 60 分钟',
  lastSwitch: '11-17 震荡 \u2192 上行',
  log: [['09:30', '开盘'], ['09:45', '定时'], ['10:00', '定时'], ['10:06', '事件 · 指数 5 分钟 \u22120.8%'], ['10:15', '定时']],
  ev: [
    { no: 1, k: '指数距 50 日线', v: '+2.4%', t: '门槛 > 0', ok: true },
    { no: 2, k: '20 日新高占比', v: '31%', t: '门槛 \u2265 20%', ok: true },
    { no: 3, k: '波动率分位', v: '28', t: '门槛 \u2264 60', ok: true },
    { no: 4, k: '涨跌家数 5 日比', v: '1.6', t: '门槛 \u2265 1.2', ok: true }
  ]
};
var NO = ['', '\u2460', '\u2461', '\u2462', '\u2463'];
function regimeBar() {
  var r = REGIME;
  var sc = [['down', '下行'], ['range', '震荡'], ['up', '上行']].map(function (x) {
    return '<span class="' + (x[0] === r.state ? 'on' : '') + '">' + x[1] + '</span>';

  var empties = '';
  if (XS.length === 0 && FILTER !== 'i') empties += '<div class="empty" data-empty="x"><span class="b st">跨日有效 0</span><span class="mut nw">下次盘后生成 11-25 16:40 ET</span></div>';
  if (IS.length === 0 && FILTER !== 'x') empties += '<div class="empty" data-empty="i"><span class="b lim">盘中事件 0</span><span class="mut nw">事件触发即出</span></div>';
  return '<section class="card sec" data-sec="cards"><div class="card-h"><h2>今日机会</h2><span class="num fg2" data-shown>' + shown.length + '</span>' +
    '<div class="seg" data-seg>' + seg + '</div>' +
    '<span class="ml meta nw">每张卡可展开归因</span></div>' +
    '<div class="card-b">' + group('x', XS, '跨日有效', '盘后生成 · 可挂限价单 · 次日 09:45 ET 起成交') + group('i', IS, '盘中事件', '刚触发 · 限时有效 · 过时自动作废') + empties + '</div></section>';
}

function ledgerSection() {
  var rows = STRATS.filter(function (s) { return s.slot === 'board' || s.slot === 'board-short'; });
  var body = '';
  ['champ', 'ch', 'out'].forEach(function (t) {
    var g = rows.filter(function (s) { return s.tier === t; });
    body += '<tr class="grp" data-grp="' + t + '"><td colspan="9">' + TIER[t] + ' <span data-count="led-' + t + '">' + g.length + '</span></td></tr>';
    if (!g.length) body += '<tr class="empty"><td colspan="9">' + (t === 'ch' ? '本周无新挑战者 · 下次周度 11-28 收盘后' : '无') + '</td></tr>';
    g.forEach(function (s) {
      var op = t === 'champ' ? '<button class="btn" title="原型 · 不生效">淘汰</button>' : t === 'ch' ? '<button class="btn" title="原型 · 不生效">晋级</button>' : '<button class="btn" title="原型 · 不生效">复活</button>';
      body += '<tr data-item="led led-' + t + '"' + (t === 'out' ? ' class="dim"' : '') + '><td class="nw"><b>' + s.name + '</b></td><td class="nw fg2">' + SIDE[s.side] + '</td><td class="nw">' + s.kind + '</td>' +
        '<td class="r num ' + (t === 'out' ? '' : tone(s.ex)) + '"><b>' + fR(s.ex) + '</b></td><td>' + ciBar(s) + '</td><td class="r num">' + s.n + '</td><td class="num nw">' + s.last + '</td>' +
        '<td class="why">' + s.why + '</td><td>' + op + '</td></tr>';
    });
  });
  return '<section class="card sec" data-sec="ledger"><div class="card-h"><h2>策略账本</h2>' +
    '<span class="chipline">' + ['champ', 'ch', 'out'].map(function (t) { return '<span class="b lim">' + TIER[t] + ' <span data-count="led-' + t + '">' + rows.filter(function (s) { return s.tier === t; }).length + '</span></span>'; }).join('') + '</span>' +
    '<span class="meta ml nw">滚动 60 交易日 · 比门内随便挑 每笔多出的 R · 在用条数不固定</span></div>' +
    '<div class="mhint meta">表内左右滑动 \u2192</div><div class="tw"><table><thead><tr><th>策略</th><th>方向</th><th>来源</th><th class="r">滚动超额</th><th>95% 区间 ' + ciScale() + '</th><th class="r">样本</th><th>最近结算</th><th>理由</th><th>操作</th></tr></thead><tbody>' +
    body + '</tbody></table></div></section>';
}

var SPEED = [
  { k: '状态切换识别', old: 52, now: 11, u: '分钟' },
  { k: '盘中事件出卡', old: 38, now: 6, u: '分钟' },
  { k: '失效策略下架', old: 20, now: 6, u: '交易日' },
  { k: '新策略上岗', old: 28, now: 9, u: '交易日' }
];
function speedSection() {
  var cut = SPEED.reduce(function (a, r) { return a + (1 - r.now / r.old); }, 0) / SPEED.length;
  var mx = {}; SPEED.forEach(function (r) { mx[r.u] = Math.max(mx[r.u] || 0, r.old); });
  var rows = SPEED.map(function (r) {
    return '<div class="sp-row" data-item="speed"><div class="sp-k"><span class="nw">' + r.k + '</span><span class="nw meta">' + r.u + '</span></div>' +
      '<div class="sp-b"><span class="lab mut nw">现网</span><span class="bar old" style="width:' + (r.old / mx[r.u] * 100).toFixed(1) + '%"></span><b class="num nw">' + r.old + '</b></div>' +
      '<div class="sp-b"><span class="lab acc nw">新</span><span class="bar new" style="width:' + (r.now / mx[r.u] * 100).toFixed(1) + '%"></span><b class="num nw acc">' + r.now + '</b></div></div>';
  }).join('');
  return '<section class="card sec" data-sec="speed"><div class="card-h"><h2>反应速度</h2><span class="b demo">DEMO</span><span class="meta nw">平均滞后 · 近 20 次</span>' +
    '<span class="meta ml nw">现网 = 整点重判 · 固定 3+3 · 周度换策略</span></div>' +
    '<div class="sp-grid"><div class="sp-big"><span class="num acc" data-cut>' + MINUS + Math.round(cut * 100) + '%</span><span class="meta nw">滞后缩短 · <span data-count="speed">' + SPEED.length + '</span> 项均值</span></div>' + rows + '</div></section>';
}

function render() {
  document.getElementById('app').innerHTML =
    '<div class="head"><h1>机会</h1><span class="meta nw">11-25 周三 · 10:24 ET · 盘中</span><span class="b demo">DEMO · 虚拟数据</span>' +
    '<span class="meta ml nw">原型 · 不接后端</span></div>' +
    regimeBar() + speedSection() +
    cardsSection() + ledgerSection();
}
render();

document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-toggle]');
  if (t) {
    var box = document.querySelector('#card-' + t.dataset.toggle + ' .cc-attr');
    var on = box.classList.toggle('on');
    t.setAttribute('aria-expanded', on); t.textContent = '归因' + (on ? ' \u25B4' : ' \u25BE');
    return;
  }
  var f = e.target.closest('[data-f]');
  if (f) {
    var u = new URL(location.href); if (f.dataset.f === 'all') u.searchParams.delete('f'); else u.searchParams.set('f', f.dataset.f);
    u.searchParams.delete('c'); location.href = u.toString();
  }
});
/* 盘中事件倒计时: 每秒减一, 归零标「已失效」 */
setInterval(function () {
  document.querySelectorAll('.cd[data-left]').forEach(function (el) {
    var left = Math.max(0, +el.dataset.left - 1), valid = +el.dataset.valid;
    el.dataset.left = left;
    el.querySelector('b').textContent = left ? mmss(left) : '已失效';
    el.classList.toggle('warn', left <= 300);
    var bar = el.closest('.cc').querySelector('.ttl span');
    bar.style.width = (left / valid * 100).toFixed(1) + '%'; bar.classList.toggle('low', left <= 300);
  });
}, 1000);
if (OPEN_C && document.getElementById('card-' + OPEN_C)) document.getElementById('card-' + OPEN_C).scrollIntoView({ block: 'center' });

</script>
</body>
</html>
