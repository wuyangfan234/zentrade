<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      // 预渲染主题脚本: 首屏前设置 html.dark, 避免亮暗闪烁 (FOUC)。
      // 默认亮色; 本设备手动切过暗色 (localStorage tf-theme=dark) 才用暗色。与 src/lib/theme.ts getTheme() 同口径。
      (function () {
        try {
          if (localStorage.getItem('tf-theme') === 'dark') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          /* 读不到存值: 按默认亮色 */
        }
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#7C3AED" />
    <title>ZenTrade · 禅交易</title>
  </head>
  <body class="bg-base text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
